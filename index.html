<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Variedades Karleny</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="barra">
        <div class="logo">🛍️ Variedades Karleny</div>

        <button class="boton-menu" onclick="mostrarMensaje()">
            Entrar
        </button>
    </header>

    <main>

        <section class="inicio">
            <div class="contenido">

                <p class="pequeno">✨ Bienvenido</p>

                <h1>
                    Todo lo que buscas,
                    <span>en un solo lugar.</span>
                </h1>

                <p class="descripcion">
                    Descubre nuestros productos y encuentra
                    algo especial para ti.
                </p>

                <button class="boton-principal" onclick="mostrarMensaje()">
                    🛍️ Ver productos
                </button>

            </div>
        </section>

    <section id="productos" class="productos">

    <h2>🛍️ Nuestros productos</h2>

    <p>Descubre todo lo que tenemos para ti.</p>

    <div class="producto">

        <img src="imagenes/labial.jpg" alt="Labial">

        <h3>Labial</h3>

        <p class="precio">$15.000</p>

    </div>
    <div class="producto">

        <img src="imagenes/peluche.jpg" alt="peluche">

        <h3>peluche</h3>

        <p class="precio">$25.000</p>
        <button onclick="comprarWhatsApp('Peluche', '25000')">
        📲 Comprar por WhatsApp
    </button>

    </div>

</section></main>

    <script src="script.js"></script>

</body>
</html>
